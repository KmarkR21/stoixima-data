name: Fetch football data

on:
  schedule:
    - cron: '0 */2 * * *'   # κάθε 2 ώρες
  workflow_dispatch: {}       # για να μπορείς να το τρέξεις χειροκίνητα από το tab Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch data from football-data.org
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python fetch_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "stoixima-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update football data"
          git push
